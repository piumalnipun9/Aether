[package]
name = "aether-settings"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The settings app of the Aether desktop"
build = "build.rs"

[dependencies]
aether-common = { path = "../aether-common" }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-software", "software-renderer-systemfonts", "software-renderer-path"] }

[build-dependencies]
slint-build = "1.18"
